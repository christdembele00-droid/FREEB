name: FREEB Expiration Cleanup

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r backend/requirements.txt
      - name: Cleanup
        env:
          DATABASE_URL: ${{ secrets.FREEB_DATABASE_URL }}
        run: PYTHONPATH=backend python backend/scripts/cleanup_expired.py
